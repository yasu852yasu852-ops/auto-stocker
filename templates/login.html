<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login</title>
</head>
<body>
  <h2>管理者ログイン</h2>
  <form method="post">
    <input name="username" placeholder="username">
    <input name="password" type="password" placeholder="password">
    <button type="submit">Login</button>
  </form>
  {% if error %}<div style="color:red">{{error}}</div>{% endif %}
</body>
</html>
