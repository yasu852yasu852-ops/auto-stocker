server {
    listen 80;
    server_name _; # replace with your server name or IP

    client_max_body_size 10M;

    location /static/ {
        alias /opt/auto-stocker/static/;
        access_log off;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
    }

    access_log /var/log/nginx/auto-stocker.access.log;
    error_log /var/log/nginx/auto-stocker.error.log;
}
